<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="header.css" />
    <link rel="stylesheet" href="welcome-words.css" />
    <link rel="stylesheet" href="product-types.css" />

    <style>
      .body-container {
        display: flex;
        flex-wrap: wrap;
        flex-direction: row;
        gap: 45px;
        margin-top: 60px;
        flex: 0 1 auto;
        padding: 0px 40px;
      }
      .product-image {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        margin: auto;
        gap: 10px;
        flex: 0 1 auto;
        align-items: center;
      }

      .product-info {
        flex: 1 1 auto; /* ← Cho phép co giãn */
        min-width: 300px; /* ← KHÔNG được nhỏ hơn 300px */
        max-width: 500px; /* ← KHÔNG được to hơn 500px */
      }

      .slide-show {
        display: flex;
        flex-direction: column;
      }

      .small-image-div {
        width: 85px;
      }

      .small-image-img {
        width: 100%;
      }

      .main-image {
        width: 450px;
      }

      .main-image-img {
        width: 100%;
      }

      @media (max-width: 768px) {
        .product-image {
          flex-direction: column;
          align-items: center;
        }

        .slide-show {
          flex-direction: row;
          gap: 10px;
        }

        .small-image-div {
          width: 60px;
        }

        .main-image {
          width: 100%;
          max-width: 450px;
        }
      }

      .product-name {
        font-weight: 600;
        font-size: 25px;
      }

      .new-price {
        font-size: 32px;
        font-weight: 700;
        color: green;
        margin-right: 18px;
      }

      .old-price {
        font-size: 27px;
        color: #999;
        text-decoration: line-through;
      }

      .utility-buttons {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
      }

      .add-button {
        background: black;
        color: white;
        width: 200px;
        height: 50px;
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
      }

      .buy-button {
        background: green;
        color: white;
        width: 200px;
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
      }

      .add-button:hover {
        background: #a855f7;
        transform: scale(1.05);
        transition: 0.3s ease-in-out;
      }

      .buy-button:hover {
        background: #34d399;
        transform: scale(1.05);
        transition: 0.15s ease-in;
      }
    </style>
  </head>
  <body>
    <div class="header-container"></div>
    <div class="body-container">
      
    </div>
  </body>
  <script src="render-header.js" defer></script>
  <script type="module" src="control-slideshow.js" defer></script>
  <script type="module" src="rerender-product-details.js" defer></script>
</html>
