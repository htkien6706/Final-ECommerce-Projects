<!DOCTYPE html>
<html>

<head>
  <title> Test UI </title>
  <style>
    body {
  font-family: Inter, system-ui, sans-serif;
}

.product-page {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  max-width: 1100px;
  margin: 60px auto;
}

.product-gallery {
  display: flex;
  gap: 16px;
}

.thumbnails {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.thumbnails img {
  width: 64px;
  height: 64px;
  object-fit: cover;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid #e5e7eb;
}

.thumbnails img:hover {
  border-color: #111;
}

.main-image img {
  width: 100%;
  max-width: 420px;
  border-radius: 12px;
}

.product-title {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 12px;
}

.price-box {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.price-sale {
  font-size: 28px;
  font-weight: 700;
  color: #dc2626;
}

.price-original {
  font-size: 16px;
  color: #9ca3af;
  text-decoration: line-through;
}

.product-desc {
  font-size: 15px;
  color: #4b5563;
  line-height: 1.6;
  margin-bottom: 24px;
}

.actions {
  display: flex;
  gap: 12px;
}

.btn-cart {
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  background: #111;
  color: white;
  border: none;
  font-size: 15px;
  cursor: pointer;
}

.btn-buy {
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  background: #dc2626;
  color: white;
  border: none;
  font-size: 15px;
  cursor: pointer;
}

  </style>
</head>

<body>
  <div class="product-page">

  <!-- IMAGE GALLERY -->
  <div class="product-gallery">
    <div class="thumbnails">
      <img src="img1.jpg" />
      <img src="img2.jpg" />
      <img src="img3.jpg" />
      <img src="img4.jpg" />
    </div>

    <div class="main-image">
      <img src="img1.jpg" />
    </div>
  </div>

  <!-- PRODUCT INFO -->
  <div class="product-details">
    <h1 class="product-title">
      Heritage Cable Knit Turtleneck Sweater
    </h1>

    <div class="price-box">
      <span class="price-sale">$62.00</span>
      <span class="price-original">$98.00</span>
    </div>

    <p class="product-desc">
      Inspired by classic heritage knitwear, this cable-knit sweater delivers
      timeless style with modern comfort.
    </p>

    <div class="actions">
      <button class="btn-cart">Add to cart</button>
      <button class="btn-buy">Buy now</button>
    </div>
  </div>

</div>


</body>

</html>
