<!DOCTYPE html>
<html>

<head>
  <style>
    .stars {
      --max: 5;
      --percent: calc(var(--rating) / var(--max) * 100%);
      position: relative;
      display: inline-block;
      font-size: 24px;
      /* chỉnh size sao */
      line-height: 1;
    }

    .stars__bg {
      color: #ddd;
      inset: 0
        /* màu sao rỗng */
    }

    .stars__fg {
      color: #f5b301;
      /* màu sao đầy */
      position: absolute;
      inset: 0;
      width: var(--percent);
      overflow: hidden;
      /* quan trọng: cắt sao theo % */
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div class="stars" style="--rating: 4.5;" aria-label="Rated 4.2 out of 5">
    <span class="stars__bg">★★★★★</span>
    <span class="stars__fg">★★★★★</span>
  </div>

</body>

</html>
