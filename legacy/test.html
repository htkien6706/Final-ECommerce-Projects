<!DOCTYPE html>
<html>
  <head>
    <title> Check UI</title>
    <style>
      .add-items-overlay {
        max-width: 520px;
        margin: auto;
        background: #ffffff;
        padding: 24px 28px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }

      .add-items-form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .add-items-form label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
        font-weight: 500;
        color: #333;
      }

      .add-items-form input,
      .add-items-form textarea {
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #d0d5dd;
        font-size: 14px;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .add-items-form textarea {
        min-height: 90px;
        resize: vertical;
      }

      .add-items-form input:focus,
      .add-items-form textarea:focus {
        outline: none;
        border-color: #4f46e5;
        box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
      }

      .price-group,
      .user-exp {
        display: flex;
        gap: 16px;
      }

      .price-group label,
      .user-exp label {
        flex: 1;
      }

      ::placeholder {
        color: #98a2b3;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    
  </body>
</html>
